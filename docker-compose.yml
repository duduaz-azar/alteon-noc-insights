services:
  query-svc:
    build: ./query-svc
    container_name: alteon-query-svc
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_DB:   ${CLICKHOUSE_DB}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/data/geoip/GeoLite2-Country.mmdb}
      AI_BRIDGE_URL: ${AI_BRIDGE_URL}
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    networks: [noc]

  gateway:
    build: ./gateway
    container_name: alteon-gateway
    environment:
      QUERY_SVC_URL: http://query-svc:8000
      AUTH_DB_PATH: /data/auth.db
    volumes:
      - ./data:/data
    depends_on: [query-svc]
    restart: unless-stopped
    networks: [noc]

  frontend:
    build: ./frontend
    container_name: alteon-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on: [gateway]
    restart: unless-stopped
    networks: [noc]

  analyzer:
    build: ./backend
    container_name: alteon-analyzer
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
    depends_on:
      - query-svc
    restart: unless-stopped
    networks: [noc]

networks:
  noc:
    driver: bridge
